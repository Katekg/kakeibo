/* 2026-10-17：縦列の中は箱をやめて「塗り分け＋両端をあけた区切り線」。収入欄・合計欄も大枠と同じ色の線で囲む */

<script>
/* 家計予算帳（手入力版）：保存先をこのスプレッドシートにする（Apps Script の google.script.run 経由）。
   元のアプリと同じ呼び方（db.collection / db.doc の onSnapshot・add・set・update・delete）で使えるようにする */
(() => {
  const CACHE = {}, subs = []; let STAMP = null, loaded = null;
  // 2026-11-21：Apps Script の画面のときは google.script.run.api、ホーム画面アプリ（GitHub Pages）のときは Apps Script に fetch。どちらも鍵（この端末に保存）を付ける
  const API_URL = "https:\/\/script.google.com\/macros\/s\/AKfycbzRQHNF5zKDHn_stsd7ma8FkKrJ5fZs2FnUXTTZfTPskfwV8TzyIRu2SIv6fr4AtLsR/exec";
  const KEY = () => { try { return localStorage.getItem("kkKey") || ""; } catch (e) { return ""; } };
  const inGAS = typeof google !== "undefined" && google.script && google.script.run;
  const keyGate = msg => { if (document.getElementById("keygate")) return; const d = document.createElement("div"); d.id = "keygate";
    d.innerHTML = `<form style="position:fixed;inset:0;z-index:9999;background:#eef6f1;display:grid;place-content:center;gap:12px;padding:24px;font:15px -apple-system,sans-serif;text-align:center"><b style="font-size:1.2rem">家計予算帳</b><span>${msg || "鍵（合言葉）を入れてください。最初の1回だけです。"}</span><input name="k" autocomplete="off" autocapitalize="off" spellcheck="false" style="font-size:16px;padding:10px 12px;border:1.5px solid #9bb;border-radius:12px;text-align:center" placeholder="xxxx-xxxx-xxxx-xxxx"><button style="font-size:16px;padding:10px;border:0;border-radius:12px;background:#2f8f5b;color:#fff">開く</button></form>`;
    d.querySelector("form").addEventListener("submit", e => { e.preventDefault(); const v = d.querySelector("input").value.trim(); if (!v) return; try { localStorage.setItem("kkKey", v); } catch (x) {} location.reload(); });
    (document.body || document.documentElement).appendChild(d); };
  const keyErr = e => { const m = String(e?.message || e); if (m.includes("KEY")){ try { localStorage.removeItem("kkKey"); } catch (x) {} keyGate("鍵がちがいます。もう一度入れてください。"); } return e; };
  const run = (fn, ...a) => (inGAS ? new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(ng).api(fn, KEY(), a))
    : fetch(API_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({fn, key: KEY(), args: a})}).then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error); return j.r; }))
    .catch(e => { throw keyErr(e); });
  const snapC = c => ({docs: Object.entries(CACHE[c] || {}).map(([id, v]) => ({id, data: () => v}))});
  const snapD = (c, id) => { const v = (CACHE[c] || {})[id]; return {exists: !!v, data: () => v}; };
  const fire = cs => subs.slice().forEach(s => { if (!cs || cs.includes(s.c)) try { s.cb(s.id == null ? snapC(s.c) : snapD(s.c, s.id)); } catch (e) { console.error(e); } });
  const load = () => loaded = (KEY() || inGAS ? run("getAll") : new Promise(() => { const g = () => keyGate(); document.body ? g() : document.addEventListener("DOMContentLoaded", g); })).then(r => { Object.keys(CACHE).forEach(k => delete CACHE[k]); Object.assign(CACHE, r.data); STAMP = r.stamp; window.KAKEI_ME = r.me || ""; window.KAKEI_SS = r.url || ""; });
  load();
  // 相手のスマホで記録した分：1分ごと（と、画面に戻ったとき）に変わったかを見て、変わっていれば読み直す
  const check = async () => { if (document.hidden) return; try { const st = await run("getStamp"); if (st !== STAMP){ await load(); fire(); } } catch (e) {} };
  setInterval(check, 60000); document.addEventListener("visibilitychange", check);
  const local = (c, id, v, st) => { if (st) STAMP = st; CACHE[c] = CACHE[c] || {}; if (v === null) delete CACHE[c][id]; else CACHE[c][id] = v; fire([c]); };
  const clean = o => JSON.parse(JSON.stringify(o));
  const listen = (c, id) => (cb, err) => { const s = {c, id, cb}; subs.push(s); loaded.then(() => cb(id == null ? snapC(c) : snapD(c, id))).catch(e => err && err(e)); return () => subs.splice(subs.indexOf(s), 1); };
  const DB = {
    collection: c => ({onSnapshot: listen(c, null), add: async doc => { const r = await run("addDoc", c, clean(doc)); local(c, r.id, r.doc, r.stamp); return {id: r.id}; }}),
    doc: p => { const [c, id] = p.split("/"); return {
      onSnapshot: listen(c, id),
      set: async doc => { let r; try { r = await run("setDoc", c, id, clean(doc), false, (CACHE[c] || {})[id]?.updatedAt ?? null); } catch (e){ if (String(e?.message || e).includes("STALE")){ await load(); fire(); const x = new Error("stale"); x.code = "stale"; throw x; } throw e; } local(c, id, r.doc, r.stamp); },   // 2026-11-17：古い画面からの上書きを止める
      update: async part => { const r = await run("setDoc", c, id, clean(part), true); local(c, id, r.doc, r.stamp); },
      delete: async () => { const r = await run("delDoc", c, id); local(c, id, null, r.stamp); }}; }
  };
  window.claude = {use: async n => n === "db" ? DB : null};
  window.GAS = run;   // Apps Script のほかの関数（Gemini で調べる aiSales・aiPrice）
})();
</script>

let db = null, dl = null;

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2, "0");
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

/* 家計簿の表示・入力は万円単位で小数1桁（例：1.5 → 15,000円）。データは万円単位に丸めて持つ（2026-10-19に万円表示から変更） */
const kIn = v => { const t = String(v ?? "").replace(/[¥,，\s円万]/g, "").replace("−", "-"); if (t === "") return null; const n = Number(t); return isFinite(n) ? Math.round(n * 10) * 1000 : null; };

/* もつ期間は日数で持つ（2026-11-10〜）。昔の記録の「ヶ月」は、使い始めた日から暦で数えて日数に直す（10/2の1ヶ月→11/2＝31日） */
const MO_D = 30.44;
const addD = (d, n) => { const x = parse(d); x.setDate(x.getDate() + Math.round(n)); return toStr(x); };
const dBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
function mo2d(mo, start){ mo = Number(mo); if (!(mo > 0)) return 0; if (!start) return Math.round(mo * MO_D);
  const w = Math.floor(mo), x = parse(start), day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + w); x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); x.setDate(x.getDate() + Math.round((mo - w) * 30));
  return Math.max(1, dBetween(start, toStr(x))); }
const d2mo = d => d ? Math.round(d / MO_D * 100) / 100 : null;
const fmtD = v => v >= 10 ? String(Math.round(v)) : String(+v.toFixed(1));

const monthly = it => !it.price ? null : Number(it.days) ? it.price / Number(it.days) * MO_D : it.months ? it.price / it.months : null;
/* 昔の品目（購入記録に日付がない）用：1個のもつ期間（ヶ月）・在庫・使い始めた日 */
const unitMo = it => Number(it.unitMonths) || (it.months ? it.months / (Number(it.packs) || 1) : 0);
const stockOf = it => Math.max(0, Number(it.stock) || 0);

const addMo = (d, mo) => addD(d, mo * 30);
const dTo = d => dBetween(TODAY, d);
/* 購入ごとの使う期間：前の分を使い切ってから次の分を使い始める、という順につなぐ。
   ・前の分の予定の日より前に買った → 今回の分は前の分の予定の日から使い始める

   done＝次の分に替わって日数が決まった期間。平均はこの日数から出す */
function chainOf(it){
  const ps = histOf(it.id).filter(p => p.date).slice().reverse(), n = ps.length, segs = [];
  if (!n){ const st = inUseOf(it), k = 1 + stockOf(it), d = Number(it.days) || Math.round(unitMo(it) * 30 * k);
    if (!st || !d) return []; const pl = addD(st, d); return [{p: null, start: st, plan: pl, end: pl, days: d, packs: k, done: false}]; }
  ps.forEach((p, i) => {
    const pv = segs[segs.length - 1]; let start = p.date;
    if (pv){ if (!pv.plan || p.fresh || p.date >= pv.plan){ pv.end = p.date > pv.start ? p.date : pv.start; } else start = pv.plan;
      pv.days = dBetween(pv.start, pv.end); pv.done = true; }
    const d = Number(p.days) || (i === n - 1 && (Number(it.days) || mo2d(it.months, start))) || mo2d(p.months, start) || Number(it.days) || mo2d(it.months, start) || 0;
    const pl = d ? addD(start, d) : null;
    segs.push({p, start, plan: pl, end: pl, days: d, planDays: d, packs: unitsOf(p), done: false});
  });
  return segs;
}
/* 交換の目安に使う個数：個数が2以上ならその数、1なら数量が「3個」「2本」のときその数 */
const unitsOf = p => { const k = Number(p.packs) || 1; if (k > 1) return k; const q = qtyNum(p.qty); return q && /^(個|本)$/.test(q.u) && q.n > 1 && q.n <= 50 ? Math.round(q.n) : 1; };

/* 今使っている分（cur）、その中の次の交換の目安（swap：もつ日数÷個数ごと）、全部なくなる日（out）、まだ開けていない個数（stock） */
function lifeOf(it){ const segs = chainOf(it); if (!segs.length) return null; const last = segs[segs.length - 1]; if (!last.plan) return null;
  const cur = segs.find(x => x.start <= TODAY && TODAY < x.end) || (TODAY < segs[0].start ? segs[0] : last), k = cur.packs, unit = cur.days / k;
  const used = cur.start <= TODAY ? Math.min(k - 1, Math.max(0, Math.floor(dBetween(cur.start, TODAY) / unit))) : -1;
  const swap = k > 1 && used < k - 1 && unit > 0 ? addD(cur.start, unit * (used + 1)) : null;
  const stock = (k - 1 - used) + segs.slice(segs.indexOf(cur) + 1).reduce((t, x) => t + x.packs, 0) - (used < 0 ? 1 : 0);
  return {segs, cur, start: cur.start, swap, out: last.plan, dSwap: swap ? dTo(swap) : null, dOut: dTo(last.plan), stock: Math.max(0, stock)}; }

function pieParts(v, kr){ const c = Math.max(0, v.c); return [["k", Math.max(0, v.k), "#6f9fd8"], ["kc", c * kr, "#c8daf1"], ["mc", c * (1 - kr), "#f4d2dc"], ["m", Math.max(0, v.m), "#e29ab0"]]; }
function pieSvg(v, kr){
  const parts = pieParts(v, kr), tot = parts.reduce((a, p) => a + p[1], 0); if (!tot) return `<p class="note">記録なし</p>`;
  const C = 2 * Math.PI * 38; let off = 0;

function lifeNisaPanel(M){ const {L, yms, V, bal} = M, kb = L.people.kazu.birth, age = y => kb ? Number(y) - Number(kb.slice(0, 4)) : null, man = v => (Math.round(v / 1000) / 10).toLocaleString("ja-JP");

  const ys = Object.keys(byY), seg = []; ys.forEach(y => { const o = byY[y], m = Math.round(o.c / o.n / 1000) * 1000, k = o.s > 0 ? "sell" : m === 0 ? "stop" : m < L.nisa ? "down" : m > L.nisa ? "up" : "base", last = seg[seg.length - 1], v = k === "sell" ? o.s : m;

/* トップを画面の高さいっぱいに：収入〜貯蓄計の段の高さを、画面の残りの高さから決める */
/* claude.ai のスマホアプリでは、上のバーの分だけページの枠（iframe）の下が画面からはみ出す。見えている高さを画面の大きさから見積もる */
// 2026-10-25：iPhoneのスクショから枠の上端は画面の上から約118pt。タブはさらに下へ（本人の希望で2026-10-25に3回下げた。iPhoneで見て調整）

const visH = () => matchMedia("(pointer: coarse)").matches && !STANDALONE ? Math.min(innerHeight, (screen.height || innerHeight) - 84) : innerHeight;

  const r = document.documentElement.style; r.setProperty("--fabTop", `${top - 70}px`); r.setProperty("--hidB", `${innerHeight - visH()}px`); r.setProperty("--visH", `${visH()}px`); } else { t.style.top = ""; t.style.bottom = ""; ["--fabTop", "--hidB", "--visH"].forEach(k => document.documentElement.style.removeProperty(k)); } }

  const H = visH();
  const se = document.scrollingElement || document.documentElement, st = se.scrollTop, top = fg.getBoundingClientRect().top + st, tb = ((document.querySelector(".totwrap") || document.querySelector(".totbar"))?.offsetHeight || 0) + 36;
  const tbt = document.querySelector(".tabs")?.getBoundingClientRect().top, bottom = (tbt > 100 ? Math.min(tbt, H - 40) - 14 : H - 86) + st;   // 下のタブの上まで（実際のタブの位置で）
  const f4 = fg.classList.contains("f4"), w = f4 ? [1, 0, .85, 1.4, .85, 1.25, 0, 0] : [1.45, .55, .9, 1.1, .9, 1.1, .45, .9], sum = w.reduce((x, y) => x + y, 0), u = Math.max(30, Math.min(110, (bottom - top - 16 - tb) / sum));
  // 2026-11-21：収入の箱の下と、貯蓄と計のあいだが空きすぎないように（空の行のすき間を詰める）

    + `L${f(w)} ${f(h - p)}c0 ${f(a)} 0 ${f(a + b)} ${f(-d)} ${f(a + b + c)}a${f(r)} ${f(r)} 0 0 1 ${f(-arc)} ${f(arc)}c${f(-c)} ${f(d)} ${f(-(b + c))} ${f(d)} ${f(-(a + b + c))} ${f(d)}`
    + `L${f(p)} ${f(h)}c${f(-a)} 0 ${f(-(a + b))} 0 ${f(-(a + b + c))} ${f(-d)}a${f(r)} ${f(r)} 0 0 1 ${f(-arc)} ${f(-arc)}c${f(-d)} ${f(-c)} ${f(-d)} ${f(-(b + c))} ${f(-d)} ${f(-(a + b + c))}`
    + `L0 ${f(p)}c0 ${f(-a)} 0 ${f(-(a + b))} ${f(d)} ${f(-(a + b + c))}a${f(r)} ${f(r)} 0 0 1 ${f(arc)} ${f(-arc)}c${f(c)} ${f(-d)} ${f(b + c)} ${f(-d)} ${f(a + b + c)} ${f(-d)}Z`;

function sqPathTop(w, h, r, sm = 0.6){
  const full = sqPath(w, Math.max(h, 2 * r * 1.6 + 2), r, sm); // 上の2つの角だけ使う

  db.doc("settings/alert").onSnapshot(s => { S.alert = s.exists ? s.data() : null; softRender(); }, err);
})();
const seen = new Set();
function mark(k){ seen.add(k); S.ready = seen.size; softRender(); }
// 毎朝の自動記録（WindowsのChromeの予約タスク）用：URL末尾 #auto-balance で残高の記録フォームを開く
let autoOpened = false;
function openAutoBalance(){
  if (autoOpened || location.hash !== "#auto-balance") return;
  autoOpened = true; UI.tab = "bal"; render(); balSheet("auto");
}
const autoTimer = setInterval(() => { if (S.ready >= 2){ clearInterval(autoTimer); setTimeout(openAutoBalance, 800); } }, 300);
window.addEventListener("hashchange", () => { autoOpened = false; if (S.ready >= 2) openAutoBalance(); });
</script>
